# hCaptcha taxonomy: canonical top-30 first (must match LABELS in
# crates/nokk-captcha/src/taxonomy.rs + manifest.json "canonical top-30"),
# then extended prompts (OOV fallback: strict threshold, CLIP path only).
# Key: canonical prompt_norm. Aliases map raw prompt words to the key.
# threshold_init mirrors taxonomy::threshold_for; train.py refines per-label
# thresholds on the calib split (sweep 0.05..0.95, argmax F1) + temperature.
# Prompt templates for CLIP fallback (see MODEL_CARD.md): mean-pool over
#   "a photo of a {label} on street" (primary), "a photo of a {label}", ...
# Augmentation note: train.py applies RandomMaskOverlay (Circle/Square/Bar,
# p=0.5) because mask overlays drop plain ViT 50-80pp; do not remove it.
# Mining note: round-1 oversamples mined FP/FN (topk 256/class, hard_ratio 0.5).
- key: truck
  aliases: [truck, trucks, lorry, lorries, pickup, fire truck]
  threshold_init: 0.60
- key: car
  aliases: [car, cars, automobile, sedan]
  threshold_init: 0.55
- key: bus
  aliases: [bus, buses, coach]
  threshold_init: 0.60
